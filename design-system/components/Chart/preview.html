<!doctype html>
<html>
<head><meta charset="utf-8"><title>Chart — preview</title></head>
<body>
<div style="padding:16px">
<div class="pt-chart" id="c">
  <h4 class="pt-chart-title">Commits per week</h4><p class="pt-chart-sub">main · last 12 weeks</p>
  <svg id="s" width="560" height="200" role="img" aria-label="Bar chart of commits per week"></svg>
  <div class="pt-chart-tooltip" id="t" hidden></div>
</div></div>
<script>
(function(){
  var data=[12,18,9,22,31,17,26,14,35,28,19,24], labels=["Jul 21","Jul 28","Aug 4","Aug 11","Aug 18","Aug 25","Sep 1","Sep 8","Sep 15","Sep 22","Sep 29","Oct 6"];
  var W=560,H=200,L=32,B=24,T=8,max=40,svg=document.getElementById('s'),tip=document.getElementById('t'),ns='http://www.w3.org/2000/svg';
  function el(n,a){var e=document.createElementNS(ns,n);for(var k in a)e.setAttribute(k,a[k]);svg.appendChild(e);return e}
  var ph=H-B-T, x0=L, bw=(W-L)/data.length;
  [0,10,20,30,40].forEach(function(v){var y=T+ph-ph*v/max; if(v) el('line',{x1:L,x2:W,y1:y,y2:y,'class':'grid'}); var t=el('text',{x:L-8,y:y+4,'text-anchor':'end','class':'tick'}); t.textContent=v;});
  el('line',{x1:L,x2:W,y1:T+ph,y2:T+ph,'class':'axis'});
  data.forEach(function(v,i){
    var h=ph*v/max, x=x0+i*bw+bw*0.2, w=bw*0.6, y=T+ph-h, r=4;
    var p=el('path',{d:'M'+x+','+(T+ph)+'V'+(y+r)+'Q'+x+','+y+' '+(x+r)+','+y+'H'+(x+w-r)+'Q'+(x+w)+','+y+' '+(x+w)+','+(y+r)+'V'+(T+ph)+'Z','class':'bar'});
    if(i%2===0){var t=el('text',{x:x+w/2,y:H-6,'text-anchor':'middle','class':'tick'}); t.textContent=labels[i];}
    var hit=el('rect',{x:x0+i*bw,y:T,width:bw,height:ph,'class':'hit'});
    function show(){p.setAttribute('data-active','');tip.hidden=false;tip.innerHTML='<div>Week of '+labels[i]+'</div><div class="row"><span class="key"></span>Commits<span class="val">'+v+'</span></div>';
      tip.style.left=Math.min(x+w+8,W-130)+'px'; tip.style.top=(y+40)+'px';}
    function hide(){p.removeAttribute('data-active');tip.hidden=true;}
    hit.addEventListener('mouseenter',show);hit.addEventListener('mouseleave',hide);
    if(i===8) show();
  });
})();
</script>
</body>
</html>
