<!doctype html>
<html>
<head><meta charset="utf-8"><title>Checkbox — preview</title></head>
<body>
<div class="pt-stage" style="gap:24px">
  <label class="pt-choice"><button class="pt-check" role="checkbox" aria-checked="true"><svg class="ph" viewBox="0 0 256 256" aria-hidden="true"><rect width="256" height="256" fill="none"/><polyline points="40 144 96 200 224 72" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="16"/></svg></button>Sign commits</label>
  <label class="pt-choice"><button class="pt-check" role="checkbox" aria-checked="false"><svg class="ph" viewBox="0 0 256 256" aria-hidden="true"><rect width="256" height="256" fill="none"/><polyline points="40 144 96 200 224 72" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="16"/></svg></button>Push tags</label>
  <label class="pt-choice" style="opacity:.5"><button class="pt-check" role="checkbox" aria-checked="false" disabled><svg class="ph" viewBox="0 0 256 256" aria-hidden="true"><rect width="256" height="256" fill="none"/><polyline points="40 144 96 200 224 72" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="16"/></svg></button>Force push</label>
</div>
</body>
</html>
