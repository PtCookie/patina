<!doctype html>
<html>
<head><meta charset="utf-8"><title>Popover — preview</title></head>
<body>
<div class="pt-stage" style="align-items:flex-start;flex-direction:column;gap:4px">
  <button class="pt-btn pt-btn--outline pt-btn--sm" data-pt-toggle="#pop" aria-haspopup="dialog" aria-expanded="true"><svg class="ph" viewBox="0 0 256 256" aria-hidden="true"><rect width="256" height="256" fill="none"/><circle cx="104" cy="80" r="24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="16"/><circle cx="168" cy="176" r="24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="16"/><line x1="128" y1="80" x2="216" y2="80" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="16"/><line x1="40" y1="80" x2="80" y2="80" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="16"/><line x1="192" y1="176" x2="216" y2="176" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="16"/><line x1="40" y1="176" x2="144" y2="176" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="16"/></svg>Presets</button>
  <div class="pt-popover" id="pop" data-pt-popup role="dialog" aria-label="Save preset">
    <div class="pt-popover-header"><h4 class="pt-popover-title">Save preset</h4><p class="pt-popover-desc">Keep the current filters for later.</p></div>
    <label class="pt-field" style="min-width:0"><span class="pt-label">Name</span><input class="pt-input" value="AA+ short-term"></label>
    <div style="display:flex;justify-content:flex-end;gap:8px"><button class="pt-btn pt-btn--ghost pt-btn--sm" data-pt-close>Cancel</button><button class="pt-btn pt-btn--default pt-btn--sm" data-pt-close>Save</button></div>
  </div>
</div>
</body>
</html>
