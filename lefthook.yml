# https://lefthook.dev/configuration/

pre-commit:
  parallel: true
  commands:
    check-types:
      glob: "*.{js,mjs,ts,tsx}"
      run: pnpm exec tsc --noEmit
    eslint:
      glob: "*.{js,cjs,mjs,ts,tsx}"
      run: pnpm exec eslint --fix {staged_files}
      stage_fixed: true
    prettier:
      glob: "*.{js,ts,tsx,css,json,yml,jsonc}"
      run: pnpm exec prettier --write {staged_files}
      stage_fixed: true
    # Lints the Android library the way an app that vendors it does (see AGENTS.md, "Android library"). The
    # files in public/android are generated, so the script builds them first. Skipped without a JDK.
    android-lint:
      glob: "{android/**/*.kt,src/emit/android.ts,src/android-lib.ts}"
      skip:
        - run: "! command -v java > /dev/null"
      run: pnpm android:lint

pre-push:
  commands:
    vitest:
      glob: "*.{js,cjs,mjs,ts,tsx}"
      run: pnpm test --run
